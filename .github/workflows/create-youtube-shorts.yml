name: Create YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Public URL of your own/authorized completed vertical video"
        required: true
        type: string
      shorts_count:
        description: "Number of Shorts"
        required: true
        type: choice
        options: ["5", "7", "10"]
        default: "5"
      min_seconds:
        description: "Minimum duration in seconds"
        required: true
        type: choice
        options: ["30", "40"]
        default: "30"
      max_seconds:
        description: "Maximum duration in seconds"
        required: true
        type: choice
        options: ["45", "60"]
        default: "60"

permissions:
  contents: read

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create Shorts review package
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_URL: ${{ inputs.youtube_url }}
          SHORTS_COUNT: ${{ inputs.shorts_count }}
          MIN_SECONDS: ${{ inputs.min_seconds }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          python -m src.shorts_creator \
            --url "$SOURCE_URL" \
            --count "$SHORTS_COUNT" \
            --min-seconds "$MIN_SECONDS" \
            --max-seconds "$MAX_SECONDS"
      - name: Upload review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-shorts-review
          path: shorts_work/jyotirling_shorts_review.zip
          if-no-files-found: error
          retention-days: 7
