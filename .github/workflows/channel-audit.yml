name: Read-only YouTube channel audit and AI preparation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: jyotirling-channel-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  channel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore AI preparation state
        uses: actions/cache@v4
        with:
          path: |
            .state/preparation.sqlite
            thumbnails/*.png
          key: jyotirling-ai-prep-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jyotirling-ai-prep-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and Devanagari font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install -r requirements.txt

      - name: Run read-only channel audit and AI preparation
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          GEMINI_MODEL: gemini-3.8-flash
          OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
        run: python main.py

      - name: Save audit, AI preparation report and thumbnail backgrounds
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-channel-audit
          path: |
            reports/*.json
            thumbnails/*.png
          if-no-files-found: error
          retention-days: 30
