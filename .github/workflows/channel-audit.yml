name: YouTube channel audit and AI preparation

on:
  workflow_dispatch:
    inputs:
      write_test:
        description: "Run one public-video YouTube write-permission test (re-saves its current metadata unchanged)"
        required: true
        type: boolean
        default: false
      apply_monday_bhajan_thumbnail:
        description: "Generate and upload a thumbnail only to the approved Monday bhajan video (5uh8YV4UHLI)"
        required: true
        type: boolean
        default: false
      from_date:
        description: "Optional inclusive start date for manual video review (YYYY-MM-DD)"
        required: false
        type: string
      to_date:
        description: "Optional inclusive end date for manual video review (YYYY-MM-DD)"
        required: false
        type: string
      manual_book_test:
        description: "Skip YouTube API and prepare today's book-based scripture thumbnails only"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feature/new-upload-preparation-queue
    paths:
      - .github/workflows/channel-audit.yml
      - src/scripture_sources.py
      - src/thumbnail_composer.py
      - src/ai_pipeline.py
      - src/preparation_queue.py
      - tests/**
      - main.py
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: jyotirling-channel-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  channel-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private scripture source repository
        uses: actions/checkout@v4
        with:
          repository: lettermanagementorthosgpgi-coder/jyotirling-scripture-storage
          ref: main
          token: ${{ secrets.SCRIPTURE_STORAGE_TOKEN }}
          path: .private-scripture-source
          persist-credentials: false

      - name: Provision scripture PDFs for this runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripture_sources/pdfs
          cp ".private-scripture-source/468980196-शिव-पुराण-shiv-puran-complete-pdf.pdf" scripture_sources/pdfs/shiv_puran.pdf
          cp ".private-scripture-source/bhagvat_gita_as_it_is_-_hindi.pdf" scripture_sources/pdfs/bhagavad_gita_yatharoop.pdf
          test -s scripture_sources/pdfs/shiv_puran.pdf
          test -s scripture_sources/pdfs/bhagavad_gita_yatharoop.pdf
          echo "Both private scripture PDFs are provisioned for this workflow run."

      - name: Restore AI preparation state
        uses: actions/cache@v4
        with:
          path: |
            .state/preparation.sqlite
            .state/channel_inventory.json
            thumbnails/*.png
          key: jyotirling-ai-prep-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jyotirling-ai-prep-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and Devanagari font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install -r requirements.txt

      - name: Run channel audit and AI preparation
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_WRITE_TEST: ${{ inputs.write_test }}
          APPLY_MONDAY_BHAJAN_THUMBNAIL: ${{ inputs.apply_monday_bhajan_thumbnail }}
          MANUAL_FROM_DATE: ${{ inputs.from_date }}
          MANUAL_TO_DATE: ${{ inputs.to_date }}
          FORCE_MANUAL_BOOK_MODE: ${{ inputs.manual_book_test }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          GEMINI_MODEL: gemini-3.8-flash
          OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: "@cf/meta/llama-3.2-1b-instruct"
          CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
        run: python main.py

      - name: Save requested manual audit report and thumbnail backgrounds
        if: always() && hashFiles('reports/*.json', 'thumbnails/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-channel-audit
          path: |
            reports/*.json
            thumbnails/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Email success notification to Gmail
        if: success()
        continue-on-error: true
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from datetime import datetime, timezone

          username = os.environ.get("GMAIL_USERNAME", "").strip()
          app_password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          if not username or not app_password:
              print("Success email skipped: GMAIL_USERNAME or GMAIL_APP_PASSWORD secret is not configured.")
              raise SystemExit(0)

          run_url = os.environ["GITHUB_RUN_URL"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          workflow = os.environ["GITHUB_WORKFLOW_NAME"]
          branch = os.environ["GITHUB_REF_NAME"]
          now = datetime.now(timezone.utc).strftime("%d %b %Y, %H:%M UTC")

          message = EmailMessage()
          message["From"] = username
          message["To"] = "mahantrajeshtiwari@gmail.com"
          message["Subject"] = f"SUCCESS: {workflow} — Run #{run_number}"
          message.set_content(
              f"GitHub Actions run completed successfully.\n\n"
              f"Workflow: {workflow}\n"
              f"Run: #{run_number}\n"
              f"Branch: {branch}\n"
              f"Completed: {now}\n\n"
              f"Open run report: {run_url}\n"
          )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(username, app_password)
              smtp.send_message(message)
          print("Success notification email sent.")
          PY
